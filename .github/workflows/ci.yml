name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Quality checks
        run: npm run test

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build:web
        env:
          NEXT_PUBLIC_BASE_PATH: /Sinal
          NEXT_PUBLIC_SITE_URL: https://hasbuen.github.io/Sinal
          NEXT_PUBLIC_API_URL: https://sinal-api.vercel.app/api/graphql
          NEXT_PUBLIC_BACKEND_ORIGIN: https://sinal-api.vercel.app
          NEXT_PUBLIC_ENABLE_WEBSOCKETS: "false"
          NEXT_PUBLIC_REALTIME_TRANSPORT: polling

  backend:
    name: Backend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Typecheck backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build
